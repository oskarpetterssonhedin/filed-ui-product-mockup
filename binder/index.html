/* Layout: icon rail | top bar over three cards (tree · viewer · tool panel) on beige. Single light theme, matching the Figma take. */
:root{
  --bg:#EFEAE3; --card:#FFFFFF; --ink:#1C1612; --ink2:#6B625D; --ink3:#8C857F;
  --line:#E7E3DD; --sel:#F0EDE8; --hover:#F7F5F2; --active:#E3DCD2; --stage:#E5E0D8; --input:#F5F4EF;
  --green:#356748; --greenT:#E3EEE6; --red:#873040; --redT:#F4E6E8; --yellow:#E9C94F; --hl:#F3E3A0; --cite:#EDE6D6; --box:#CFCAC4; --slate:#3E4A5C; --pdf:#C8442F; --xls:#2E7D4F; --stageline:#D9D2C9; --active2:#D9D1C6; --band:#DDD6CC; --band2:#D2CABF;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Castillon VAR Trial","Castillon","Newsreader","Iowan Old Style",Georgia,serif;
  --doc:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 13px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;shape-rendering:geometricPrecision}
svg.i.lg{width:20px;height:20px;stroke-width:1.7}
svg.i.sm{width:12px;height:12px;stroke-width:2.2}
.mono{font-family:var(--mono)}
.app{height:100%;display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.main{min-height:0}
/* rail */
.rail{display:flex;flex-direction:column;align-items:center;padding:8px 0 12px;gap:4px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--input);display:grid;place-items:center;font:500 10px/1 var(--mono);letter-spacing:.04em;margin-bottom:10px}
.navb{position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
.navb:hover{background:var(--sel)}
.navb[aria-current="page"]{background:var(--active);color:var(--ink)}
.navb .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.rail .sp{flex:1}
.avatar{width:28px;height:28px;border-radius:50%;background:#443E3A;color:var(--input);display:grid;place-items:center;font:500 10px/1 var(--mono);margin-top:6px}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;z-index:50;left:calc(100% + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--ink);color:var(--input);font:500 11px/1 var(--sans);padding:6px 8px;border-radius:6px;pointer-events:none}
[data-tip-pos="below"]:hover::after{left:50%;top:calc(100% + 6px);transform:translateX(-50%)}
/* main */
.main{display:grid;grid-template-rows:48px minmax(0,1fr);min-width:0;margin:0;padding:0 8px 8px 0;background:transparent;border-radius:0}
.top{display:flex;align-items:center;gap:8px;padding-left:16px;min-width:0;position:relative;z-index:20}
@media (max-width:820px){.top{overflow-x:auto;scrollbar-width:none}}
.crumb{display:flex;align-items:center;gap:8px;white-space:nowrap;font:500 12px/1 var(--sans);color:var(--ink2)}
.crumb .sep{color:var(--ink3);font-weight:400}
.crumb button{display:flex;align-items:center;gap:4px;padding:7px 6px;margin:0 -6px;border-radius:7px}
.crumb button:hover,.crumb button[aria-expanded="true"]{background:var(--active);color:var(--ink)}
.steps{display:flex;align-items:center;gap:0}
.next{display:none!important}
.next.ready{display:inline-flex!important}
.next{align-items:center;gap:4px;height:30px;padding:0 8px 0 12px;margin-right:0;border-radius:8px;border:1px solid var(--box);color:var(--ink2);font:500 12px/1 var(--sans);white-space:nowrap}
.next:hover{background:var(--active);color:var(--ink)}
.next.ready{background:var(--ink);border-color:var(--ink);color:var(--input)}
.next.ready:hover{background:#322C27}
.next [data-tip]:hover::after{left:auto}
#nextStep[data-tip]:hover::after{left:auto;right:0;transform:none}
.step{position:relative;display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:8px;color:var(--ink2);font:500 12px/1 var(--sans);white-space:nowrap}
.step:hover{background:var(--active)}
.step .sl{display:none}.step .sl.on{display:inline}
@media (min-width:1280px){.step .sl{display:inline}.step{padding-right:10px}}
.step.on{background:var(--active);color:var(--ink);padding-right:10px}
.step .st{position:absolute;top:6px;left:20px;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--bg)}
.step.on .st{box-shadow:0 0 0 2px var(--active)!important}
.step .st{box-shadow:0 0 0 2px var(--bg)}
.step .st.review{background:var(--bg);border:1.25px solid var(--ink3);width:6px;height:6px;box-sizing:border-box}
.chev{color:#B8B0A8;display:grid;place-items:center;width:16px}
.iconbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--sel);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
.panels{display:flex;gap:0;min-height:0;min-width:0;background:var(--stage);padding:0;border-radius:10px}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(28,22,18,.04);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.head{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px}
.head .grow{flex:1}
.title{font:300 24px/1 "Filed Castillon",var(--serif);font-variation-settings:'wght' 370;letter-spacing:-.01em;margin-right:4px}
.ptitle{font:500 13px/1 var(--sans)}
.chip.neutral{background:transparent;color:var(--ink3);padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 6px;border-radius:8px;background:var(--greenT);color:var(--green);font:500 11px/1 var(--sans)}
/* tree */
.tree{width:var(--w,320px);flex:none}
.tree .body{flex:1;overflow:auto;padding:0 8px 8px}
.tree .head{padding-right:10px}
.row{position:relative;display:flex;align-items:center;height:28px;border-radius:8px;padding-right:8px;cursor:pointer;color:var(--ink)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.row.folder .lbl{font-weight:500}
.row .ico{color:var(--ink2);margin-right:8px}
.row.folder .ico{color:var(--ink3)}
.row .meta{font:400 11px/1 var(--sans);color:var(--ink3);margin-left:8px;white-space:nowrap}
.row .ico.pdfc,.row .ico.xlsc{color:var(--ink3);display:inline-flex}
.row.sel .ico.pdfc{color:var(--pdf)}.row.sel .ico.xlsc{color:var(--xls)}
.row .hov{display:none}
.row:hover .hov{display:inline}
.row .count{font:400 12px/1 var(--sans);color:var(--ink3)}
.row .obs{width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:8px;flex:none}
.cb{width:14px;height:14px;border-radius:4px;border:1px solid var(--box);background:var(--card);display:grid;place-items:center;margin-right:6px;flex:none;color:var(--green)}
.cb[aria-checked="true"]{background:var(--greenT);border-color:var(--green)}
.cb svg{width:10px;height:10px;stroke-width:2.8}
.cb[aria-checked="false"] svg{display:none}
.sect{font:500 11px/1 var(--sans);color:var(--ink2);padding:14px 8px 8px}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:var(--input);font:400 11px/18px var(--mono);text-align:center;padding:0 5px}
.tree .foot{padding:8px 16px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:500 13px/1 var(--sans)}
.btn:hover{background:var(--hover)}
.btn.block{width:100%}
.btn.primary{background:var(--ink);color:var(--input);border-color:var(--ink)}
.btn.primary:hover{background:#322C27}
/* viewer */
.viewer{flex:1;background:transparent;box-shadow:none;border-radius:0}
.tree,.side{position:relative;z-index:1;box-shadow:none}
@media (min-width:821px){.tree{border-radius:10px 0 0 10px}}
@media (min-width:1181px){.side{border-radius:0 10px 10px 0}}
.viewer .head{gap:2px;position:absolute;top:0;left:0;right:0;z-index:5;background:rgba(229,224,216,.72);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}
.viewer{position:relative}
.viewer .head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px}
.viewer .head .vl,.viewer .head .vc,.viewer .head .vr{display:flex;align-items:center;gap:2px;min-width:0}
.viewer .head .vr{justify-content:flex-end}
.viewer .head .vr .hvr{display:none}
@container (max-width:860px){.viewer .head{display:flex;gap:2px}.viewer .head .vl{flex:1 1 auto;margin-right:8px}.viewer .head .vc,.viewer .head .vr{flex:none}.viewer .head .vr .hvr{display:block}}
.viewer .head .docmeta{margin-right:8px}
.viewer .head .docname{margin-right:6px}
.viewer .head .hvr{margin:0 8px}
.viewer .head #soBtn{margin-right:2px}
.stage{overflow:hidden}
.docname{font:500 13px/1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.docmeta{color:var(--ink3);white-space:nowrap}
.ctl{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:400 12px/1 var(--sans);white-space:nowrap}
.ctl:hover{background:var(--hover)}
.ctl.on{background:var(--sel);border-color:#D4CCC2;font-weight:500}
.ctl .muted{color:var(--ink3)}
.signoff[aria-pressed="true"]{color:var(--green);border-color:#C9DCCF}
.signoff .box{width:14px;height:14px;border-radius:4px;border:1px solid var(--box);display:grid;place-items:center}
.signoff[aria-pressed="true"] .box{background:var(--greenT);border-color:var(--green)}
.signoff .box svg{width:10px;height:10px;stroke-width:2.8;display:none}
.signoff[aria-pressed="true"] .box svg{display:block}
.stage{position:relative;flex:1;min-height:0}
.scroll{position:absolute;inset:0;overflow:auto;padding:64px 0 96px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.scroll{scroll-behavior:auto}}
.pages{display:flex;flex-direction:column;align-items:center;gap:16px}
.page{background:#fff;width:calc(520px * var(--z,1));aspect-ratio:8.5/11;box-shadow:0 0 0 1px rgba(28,22,18,.08),0 4px 12px rgba(28,22,18,.06);position:relative;font-family:var(--doc);color:#111;font-size:calc(10px * var(--z,1));max-width:calc(100% - 32px)}
.page .pin{position:absolute;inset:calc(48px * var(--z,1)) calc(46px * var(--z,1))}
.page h2{font:700 1.5em/1.2 var(--doc);text-align:center;margin:0 0 .8em}
.page table{width:100%;border-collapse:collapse;font-size:.9em}
.page th{background:#d9d9d9;text-align:left;font-weight:700;padding:.3em .5em;border:1px solid #444}
.page td{padding:.3em .5em;border:1px solid #444}
.page td.v{text-align:right;cursor:default;position:relative}
.page td.n{width:3.5em}
.page .note{color:#666;font-size:.85em;margin-top:1em}

 ['Markups',[['textbox','Text box','T','textbox'],['msg','Callout text box','','callout'],['arrow','Arrow','A','arrow'],['line','Line','L','line'],['circle','Circle','','circle'],['oval','Oval','','oval'],['rect','Rectangle','','rect']]],
 ['Workpaper tools',[['note','Sticky note','N','note'],['link','Cross reference','X','xref']]]];
const stamps=[['check','Tick','3','tick','var(--green)'],['x','Cross','4','cross','var(--red)'],['flag','Flag','F','flag','var(--red)'],['stamp','Tax return','1','s1'],['stamp','Duplicate','2','s2'],['stamp','Estimate','','s3'],['stamp','Prepared by client','','s4'],['stamp','Prior year','','s5'],['stamp','Reviewed','','s6'],['stamp','Recalculated','','s7'],['stamp','Same as last year','','s8']];
const allTools=[...tools.flatMap(g=>g[1]),...stamps];
const starEl=id=>`<span class="star ${S.favs.includes(id)?'on':''}" data-fav="${id}" role="button" aria-label="${S.favs.includes(id)?'Remove from favorites':'Add to favorites'}">${ic('star','sm')}</span>`;
const live=['select','eraser','highlighter','htext','tick','cross','flag'];
function renderSide(){const b=$('#sideBody');$$('.switch [data-panel]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.panel===S.panel));
 $('#sideTitle').textContent={annotations:'Annotations',calc:'Calculator tape',chat:'Chat'}[S.panel];
 $('#sideFoot').hidden=S.panel!=='annotations';$('#app').classList.toggle('mode-mark',S.panel==='annotations'&&S.tool!=='select');$('#app').classList.toggle('mode-calc',S.panel==='calc');
 if(S.panel==='annotations'){let h=`<div class="search" style="margin:0 0 4px">${ic('search')}<input id="toolQ" placeholder="Search tools and stamps" aria-label="Search annotation tools"><span class="kbd">⌘K</span></div>`;
  const fv=S.favs.map(id=>allTools.find(t=>t[3]===id)).filter(Boolean);
  if(fv.length){const cl=S.closedGroups.Favorites;h+=`<div class="grp ${cl?'closed':''}" data-grp="Favorites">Favorites<span class="c">${ic('cdown','sm')}</span></div>`;
   if(!cl)h+=fv.map(([i,l,k,id,col])=>`<button class="tool fav" data-tool="${id}" aria-pressed="${S.tool===id}"><span style="color:${stamps.some(x=>x[3]===id)?(col||'var(--ink2)'):'inherit'};display:inline-flex">${ic(i)}</span><span>${l}</span><span class="rt">${starEl(id)}<span class="dslot">${col&&!stamps.some(x=>x[3]===id)?`<span class="sw" style="background:${col}"></span>`:''}</span><span class="slot">${k?`<span class="kbd k">${k}</span>`:''}</span></span></button>`).join('');}
  for(const [g,items] of tools){const cl=S.closedGroups[g];h+=`<div class="grp ${cl?'closed':''}" data-grp="${g}">${g}<span class="c">${ic('cdown','sm')}</span></div>`;
   if(!cl)h+=items.map(([i,l,k,id,col])=>`<button class="tool" data-tool="${id}" aria-pressed="${S.tool===id}">${ic(i)}<span>${l}</span><span class="rt">${starEl(id)}<span class="dslot">${col?`<span class="sw" style="background:${col}"></span>`:''}</span><span class="slot">${k?`<span class="kbd k">${k}</span>`:''}</span></span></button>`).join('');}
  const cl=S.closedGroups.Stamps;h+=`<div class="grp ${cl?'closed':''}" data-grp="Stamps">Stamps<span class="c">${ic('cdown','sm')}</span></div>`;
  if(!cl)h+=`<div class="stamps">${stamps.map(([i,l,k,id,col])=>`<button class="tool" data-tool="${id}" aria-pressed="${S.tool===id}"><span style="color:${col||'var(--ink2)'};display:inline-flex">${ic(i)}</span><span>${l}</span><span class="rt">${starEl(id)}<span class="slot">${k?`<span class="kbd k">${k}</span>`:''}</span></span></button>`).join('')}</div>`;
  b.innerHTML=h;$('#toolQ').oninput=e=>{const q=e.target.value.toLowerCase();b.querySelectorAll('.tool').forEach(t=>t.hidden=!t.textContent.toLowerCase().includes(q));};return;}
 if(S.panel==='calc'){const tot=S.tape.reduce((s,x)=>s+(x.op==='−'?-x.v:x.v),0);
  b.innerHTML=`<div class="calc"><div class="disp" id="disp">${S.calc}</div><div class="keys">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+'].map(k=>`<button data-k="${k}" class="${'÷×−+'.includes(k)?'op':''}">${k}</button>`).join('')}<button data-k="=" class="eq" style="grid-column:span 4">Add to tape</button></div>
   <div class="tape">${S.tape.length?S.tape.map(x=>`<div class="l"><span style="color:var(--ink3)">${x.op} ${esc(x.src||'')}</span><span>${fmt(x.v)}</span></div>`).join('')+`<div class="l t"><span>Total</span><span>${fmt(tot)}</span></div>`:'<div style="color:var(--ink3)">No entries yet</div>'}</div>
   <p class="hint">Click a number in the document to add it to the tape.</p></div>`;return;}
 renderChat();}
$('#sideBody').addEventListener('click',e=>{const g=e.target.closest('[data-grp]');if(g){S.closedGroups[g.dataset.grp]=!S.closedGroups[g.dataset.grp];renderSide();return;}
 const fs=e.target.closest('[data-fav]');if(fs){e.stopPropagation();const id=fs.dataset.fav,i=S.favs.indexOf(id),nm=allTools.find(t=>t[3]===id)[1];i>=0?S.favs.splice(i,1):S.favs.push(id);renderSide();toast(i>=0?`${nm} removed from favorites`:`${nm} added to favorites`);return;}
 const t=e.target.closest('[data-tool]');if(t){const id=t.dataset.tool;if(id==='fit'){setZoom(fitZ(),true);toast('Fit to width');return;}S.tool=id;renderSide();if(!live.includes(id))toast(`${t.textContent.trim()} is not built in the prototype`);else if(id!=='select')toast('Click a value in the document');return;}
 const k=e.target.closest('[data-k]');if(k){const v=k.dataset.k;if(v==='C')S.calc='0';else if(v==='='){const n=parseFloat(S.calc);if(!isNaN(n)&&n!==0){S.tape.push({op:'+',v:n,src:'typed'});S.calc='0';}}else if('÷×−+'.includes(v)){const n=parseFloat(S.calc);if(!isNaN(n)){S.tape.push({op:v==='−'?'−':'+',v:n,src:'typed'});S.calc='0';}}else S.calc=S.calc==='0'&&v!=='.'?v:S.calc+v;renderSide();return;}
 const c=e.target.closest('[data-cite]');if(c){cite();return;}
 const a=e.target.closest('[data-act]');if(a){const v=a.dataset.act;
  if(v==='tick'){((S.marks.redwood??={})['p2-1']??=[]).includes('tick')||S.marks.redwood['p2-1'].push('tick');openDoc('redwood',2);toast('Ticked line 1 on the Redwood K-1');}
  if(v==='copy'){navigator.clipboard?.writeText('Yes. Line 1 ordinary business income matches Schedule E on the 2024 return draft.').then(()=>toast('Copied'),()=>toast('Copy is blocked here'));}
  if(v==='regen')toast('Regenerates the answer');if(v==='good')toast('Thanks for the feedback');if(v==='new'){S.chatNew=true;renderSide();}if(v==='hist')toast('Opens past conversations');
  if(v==='sugg'){S.chatNew=false;renderSide();}
  if(v==='src2')openDoc('ret',4);if(v==='src3')toast('Opens the 2023 K-1');}});
$$('.switch [data-panel]').forEach(b=>b.onclick=()=>{S.panel=b.dataset.panel;try{localStorage.setItem('binderProtoPanel',S.panel);}catch(e){}renderSide();});
$('#showDel').onclick=e=>{S.showDel=!S.showDel;e.currentTarget.setAttribute('aria-checked',S.showDel);renderPages();};
function cite(){S.cite={doc:'redwood',row:'1'};openDoc('redwood',2);setTimeout(()=>{const r=$('tr.cite');if(r){r.classList.add('flash');}},400);}
function openChatTab(){S.panel='chat';S.sideHidden=false;layout();renderSide();$('#side').classList.remove('mclosed');setTimeout(()=>$('#ask')?.focus(),50);}
function renderChat(){const b=$('#sideBody');
 const comp=`<div class="composer"><textarea id="ask" placeholder="Ask about this binder…" aria-label="Ask about this binder"></textarea><div class="crow"><button class="round" aria-label="Attach">${ic('plus')}</button><span class="ctx">${ic('folder','sm')}${esc(S.client)}</span><span style="flex:1"></span><button class="iconbtn" aria-label="Dictate">${ic('mic')}</button><button class="round go" id="sendBtn" aria-label="Send">${ic('send')}</button></div></div>`;
 const conv=`<div class="conv">${S.chatNew?'New conversation':'Redwood K-1 tie-out'}<button class="iconbtn" style="width:22px;height:22px;color:var(--ink3)" aria-label="Rename">${ic('pencil','sm')}</button><span style="flex:1"></span><button class="iconbtn" data-act="hist" aria-label="History">${ic('history')}</button><button class="iconbtn" data-act="new" aria-label="New conversation">${ic('plus')}</button></div>`;
 const body=S.chatNew?`<div class="hello"><h3>Hello, Alex</h3><p style="color:var(--ink2);margin:0 0 16px">Ask anything about ${esc(S.client)}’s binder.</p>
   <div class="srcl">Start with</div><button class="sugg" data-act="sugg">${ic('history')}What changed since last year?</button><button class="sugg" data-act="sugg">${ic('folder')}What’s in this binder?</button><button class="sugg" data-act="sugg">${ic('flag')}Which documents are flagged?</button></div>`
  :`<div class="you">Does ordinary income on the Redwood K-1 match the 2024 return draft?</div>
   <div class="agent">${ic('clock','sm')}Worked for 27s · read 3 documents</div>
   <div class="ans"><p>Yes. Line 1 ordinary business income <span class="cref" data-cite role="button" tabindex="0" aria-label="Source 1">1</span> matches Schedule E on the 2024 return draft, with no difference.</p>
   <div class="figs"><div><small>K-1 line 1</small><b>$275,000</b></div><div><small>Sch. E</small><b>$275,000</b></div><div><small>Difference</small><b style="color:var(--green)">$0</b></div></div>
   <p>Cash distributions of $150,000 (line 19A) also match the capital account withdrawals.</p>
   <div class="srcl">Sources</div>
   <button class="src on" data-cite><span class="n">1</span>${ic('file')}<span>Redwood Growth Equity LLC</span><span class="m">p2 · line 1</span></button>
   <button class="src" data-act="src2"><span class="n">2</span>${ic('file')}<span>2024 Tax Return draft</span><span class="m">Sch E · p4</span></button>
   <button class="src" data-act="src3"><span class="n">3</span>${ic('file')}<span>Redwood Growth Equity LLC</span><span class="m">2023 · p1</span></button>
   <div class="acts"><button class="btn primary" data-act="tick">${ic('check')}Tick line 1 on K-1</button><button class="iconbtn" data-act="copy" aria-label="Copy">${ic('copy')}</button><button class="iconbtn" data-act="regen" aria-label="Regenerate">${ic('refresh')}</button><button class="iconbtn" data-act="good" aria-label="Good response">${ic('thumb')}</button></div></div>`;
 b.innerHTML=`<div class="chat">${conv}<div class="msgs" id="msgs">${body}</div>${comp}</div>`;
 const send=()=>{const t=$('#ask');const q=t.value.trim();if(!q)return;const m=$('#msgs');if(S.chatNew){m.innerHTML='';S.chatNew=false;}
  m.insertAdjacentHTML('beforeend',`<div class="you">${esc(q)}</div><div class="agent">${ic('clock','sm')}Worked for 2s</div><div class="ans"><p>This prototype only has one prepared answer. In the product, Filed reads the binder and answers with sources you can click.</p></div>`);t.value='';m.scrollTop=m.scrollHeight;};
 $('#sendBtn').onclick=send;$('#ask').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};}

/* ---------- panels collapse ---------- */
const RZ={tree:[240,480],side:[300,520]};
function addRz(id,edge){const el=$('#'+id);const h=document.createElement('div');h.className='rz rz-'+edge;h.setAttribute('role','separator');h.setAttribute('aria-orientation','vertical');h.setAttribute('aria-label','Resize panel');h.title='Drag to resize. Double-click to reset.';el.appendChild(h);
 const set=w=>{el.style.setProperty('--w',w+'px');};
 try{const w=+localStorage.getItem('rz-'+id);if(w)set(w);}catch(_){}
 h.addEventListener('pointerdown',e=>{e.preventDefault();h.setPointerCapture(e.pointerId);const x0=e.clientX,w0=el.offsetWidth;document.body.classList.add('resizing');h.classList.add('on');let raf=0;
  const mv=ev=>{const d=edge==='r'?ev.clientX-x0:x0-ev.clientX;const [mn,mx]=RZ[id];set(Math.min(mx,Math.max(mn,w0+d)));if(id==='tree'&&!raf)raf=requestAnimationFrame(()=>{raf=0;renderTree();});};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);document.body.classList.remove('resizing');h.classList.remove('on');try{localStorage.setItem('rz-'+id,el.offsetWidth)}catch(_){};if(id==='tree')renderTree();};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);});
 h.addEventListener('dblclick',()=>{el.style.removeProperty('--w');try{localStorage.removeItem('rz-'+id)}catch(_){};if(id==='tree')renderTree();});}
addRz('tree','r');addRz('side','l');
function layout(){$('#tree').classList.toggle('collapsed',S.treeHidden);$('#side').classList.toggle('collapsed',S.sideHidden);renderVHead();setTimeout(renderTree);}
$('#treeHide').onclick=()=>{if(matchMedia('(max-width:820px)').matches){$('#tree').classList.add('mclosed');return;}S.treeHidden=true;layout();};
$('#sideHide').onclick=()=>{if(matchMedia('(max-width:1180px)').matches){$('#side').classList.add('mclosed');return;}S.sideHidden=true;layout();};
$('#mTree').onclick=()=>$('#tree').classList.toggle('mclosed');
$('#mSide').onclick=()=>$('#side').classList.toggle('mclosed');
if(matchMedia('(max-width:1180px)').matches)$('#side').classList.add('mclosed');
if(matchMedia('(max-width:820px)').matches)$('#tree').classList.add('mclosed');
$('#addDocs').onclick=()=>toast('Opens the upload dialog');
$('#walk').onclick=()=>toast('Starts the Binder walkthrough');
$$('.rail [data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav!=='Clients')toast(`Opens ${b.dataset.nav}`);});

/* ---------- command menu ---------- */
let cmdEl=null;
function cmds(){return [
 {g:'Suggestions',i:'signoff',l:S.signed[S.doc]?'Undo sign-off':'Sign off document',k:['⌘','↵'],run:()=>toggleSign(S.doc)},
 {g:'Suggestions',i:'cdown',l:'Next document',k:['J'],run:()=>step(1)},
 {g:'Suggestions',i:'cup',l:'Previous document',k:['K'],run:()=>step(-1)},
 {g:'Suggestions',i:'check',l:'Tick',k:['3'],run:()=>pickTool('tick')},
 {g:'Suggestions',i:'pen',l:'Highlighter',k:['G'],run:()=>pickTool('highlighter')},
 {g:'Go to',i:'folder',l:'Documents',k:['G','D'],run:()=>toast('Opens Documents')},
 {g:'Go to',i:'table',l:'Data entry',k:['G','E'],run:()=>toast('Opens Data entry')},
 {g:'Go to',i:'clip',l:'AI review',k:['G','A'],run:()=>toast('Opens AI review')},
 {g:'Go to',i:'users',l:'Switch client…',k:['⌘','J'],run:()=>openClients($('#crClient'))},
 {g:'Go to',i:'msg',l:'Ask Filed in chat',k:[],run:()=>openChatTab()},
 {g:'Binder',i:'upload',l:'Add documents',k:['⌘','U'],run:()=>toast('Opens the upload dialog')},
 {g:'Binder',i:'download',l:'Download document',k:['⌘','S'],run:()=>toast(`Downloading ${D[S.doc].name}.pdf`)},
 {g:'Binder',i:'eyeoff',l:S.hideAnn?'Show annotations':'Hide annotations',k:['⇧','H'],run:toggleHide},
 {g:'Binder',i:'refresh',l:'Reprocess binder',k:[],run:()=>toast('Reprocessing the binder')}];}
function pickTool(t){S.panel='annotations';S.tool=t;S.sideHidden=false;layout();renderSide();toast('Click a value in the document');}
function openCmd(prefill){if(cmdEl)return;closePop();const sc=document.createElement('div');sc.className='scrim';
 sc.innerHTML=`<div class="cmd" role="dialog" aria-label="Command menu"><span class="ctx ctxl">${esc(S.client)} · Binder</span><div class="in">${ic('search')}<input id="cmdQ" placeholder="Type a command or search…" aria-label="Command"></div><div class="list" id="cmdL"></div><div class="ft"><span>↑↓ to move</span><span>↵ to run</span><span>esc to close</span></div></div>`;
 document.body.appendChild(sc);cmdEl=sc;let act=0,items=[];
 const draw=()=>{const q=$('#cmdQ').value.toLowerCase();items=cmds().filter(c=>c.l.toLowerCase().includes(q));
  const dm=q?docs.filter(d=>d.name.toLowerCase().includes(q)).map(d=>({g:'Documents',i:d.type==='PDF'?'file':'sheet',l:d.name,k:[],run:()=>openDoc(d.id)})):[];items=[...dm,...items];act=Math.min(act,Math.max(0,items.length-1));
  let h='',g='';items.forEach((c,i)=>{if(c.g!==g){g=c.g;h+=`<div class="lab">${g}</div>`;}h+=`<div class="item ${i===act?'act':''}" data-i="${i}">${ic(c.i)}<span>${esc(c.l)}</span><span class="r">${c.k.map(k=>`<span class="kbd">${k}</span>`).join('')}</span></div>`;});
  $('#cmdL').innerHTML=h||`<div class="lab">Nothing matches</div>`;const a=$('#cmdL .act');a&&a.scrollIntoView({block:'nearest'});};
 const run=i=>{const c=items[i];closeCmd();c&&c.run();};
 $('#cmdQ').value=prefill||'';draw();$('#cmdQ').focus();
 $('#cmdQ').oninput=()=>{act=0;draw();};
 $('#cmdQ').onkeydown=e=>{if(e.key==='ArrowDown'){act=Math.min(items.length-1,act+1);draw();e.preventDefault();}else if(e.key==='ArrowUp'){act=Math.max(0,act-1);draw();e.preventDefault();}else if(e.key==='Enter'){run(act);}else if(e.key==='Escape')closeCmd();};
 $('#cmdL').onmousemove=e=>{const it=e.target.closest('[data-i]');if(it&&+it.dataset.i!==act){act=+it.dataset.i;draw();}};
 $('#cmdL').onclick=e=>{const it=e.target.closest('[data-i]');if(it)run(+it.dataset.i);};
 sc.onmousedown=e=>{if(e.target===sc)closeCmd();};}
function closeCmd(){if(cmdEl){cmdEl.remove();cmdEl=null;}}
$('#treeSearch').onclick=()=>openCmd('');
function showKeys(){const sc=document.createElement('div');sc.className='scrim';const ks=[['Command menu','⌘ K'],['Switch client','⌘ J'],['Next / previous document','J / K'],['Select','V'],['Highlighter','G'],['Tick · Cross · Flag','3 · 4 · F'],['Eraser','E'],['Hide annotations','⇧ H'],['Close','esc']];
 sc.innerHTML=`<div class="cmd" role="dialog" aria-label="Keyboard shortcuts"><div class="in" style="padding-top:14px"><b style="color:var(--ink);font-weight:500">Keyboard shortcuts</b></div><div class="shortcuts">${ks.map(([a,b])=>`<span>${a}</span><span class="mono" style="color:var(--ink2)">${b}</span>`).join('')}</div></div>`;
 document.body.appendChild(sc);sc.onmousedown=()=>sc.remove();const off=e=>{if(e.key==='Escape'){sc.remove();removeEventListener('keydown',off);}};addEventListener('keydown',off);}

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(document.activeElement?.tagName);
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdEl?closeCmd():openCmd();return;}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='i'){e.preventDefault();openChatTab();return;}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='j'){e.preventDefault();openClients($('#crClient'));return;}
 if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();toggleSign(S.doc);return;}
 if(e.key==='Escape'){closePop();closeCmd();return;}
 if(typing||cmdEl||e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key;if(k==='j'||k==='J'&&!e.shiftKey)step(1);else if(k==='k')step(-1);else if(k==='H'&&e.shiftKey)toggleHide();
 else if(k==='?')showKeys();else{const m={v:'select',e:'eraser',g:'highlighter',h:'htext','3':'tick','4':'cross',f:'flag'}[k.toLowerCase()];if(m&&!(k==='H'))pickTool(m);}});

/* ---------- boot ---------- */
function renderAll(){renderTree();renderVHead();renderPages();renderSide();}
renderAll();
document.fonts&&document.fonts.ready.then(renderTree);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderTree,120);});
})();
</script>
