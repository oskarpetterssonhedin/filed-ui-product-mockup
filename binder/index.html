/* Direction B · v3. Rail | top bar | three white panels floating on beige. Paper sits flat on the beige and scrolls under the toolbar card. */
:root{
  --bg:#E5DED7;--card:#fff;--ink:#1C1612;--ink2:#5A544F;--ink3:#6E665F;--ph:#8C857F;--sep:#A39C96;--faint:#BAB6B2;
  --line:#E4E1DC;--border:#E4E1DC;--kbdb:#E4E1DC;--field:#EFECE7;--sel:#E4E1DC;--hover:#F7F6F2;--neutral:#EFECE7;
  --green:#356748;--amber:#E5A14B;--amberT:#FCE8CA;--amberI:#82510D;--red:#873040;--redT:#FCE5E3;--blue:#2D5883;--blueT:#E0EEF9;--hl:#F6DC7C;--brown:#2E1A10;--pdf:#C8442F;--xls:#2E7D4F;
  --sh-card:0 0 0 .5px rgba(46,26,16,.16),0 1px 2px rgba(46,26,16,.06),0 6px 16px rgba(46,26,16,.09);
  --sh-pop:0 0 0 .5px rgba(46,26,16,.18),0 2px 6px rgba(46,26,16,.06),0 12px 32px rgba(46,26,16,.12);
  --sh-seg:0 1px 2px rgba(46,26,16,.08);
  --ease:cubic-bezier(.2,.8,.2,1);--ease-panel:cubic-bezier(.32,.72,0,1);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Castillon VAR Trial","Castillon","Newsreader",Georgia,serif;
  --doc:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 13px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.875;stroke-linecap:butt;stroke-linejoin:miter}
svg.i.lg{width:20px;height:20px;stroke-width:1.5}
svg.i.sm{width:12px;height:12px;stroke-width:2.2}
.kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border:1px solid var(--kbdb);border-radius:4px;background:#fff;font:400 10px/1 var(--mono);color:var(--ink2)}
/* tooltips: Linear-style delay */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;z-index:90;left:calc(100% + 8px);top:50%;transform:translateY(-50%) translateX(-2px);white-space:pre;background:var(--ink);color:#F5F4EF;font:500 11px/1 var(--sans);padding:6px 8px;border-radius:6px;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .1s,transform .1s var(--ease),visibility 0s .1s}
[data-tip]:hover::after{opacity:1;visibility:visible;transform:translateY(-50%);transition:opacity .12s .45s,transform .16s .45s var(--ease),visibility 0s .45s}
[data-tip-pos="below"]::after{left:50%;top:calc(100% + 6px);transform:translateX(-50%) translateY(-2px)}
[data-tip-pos="below"]:hover::after{transform:translateX(-50%)}
[data-tip-pos="left"]::after{left:auto;right:calc(100% + 8px)}
[data-tip-pos="below-r"]::after{left:auto;right:0;top:calc(100% + 6px);transform:translateY(-2px)}
[data-tip-pos="below-r"]:hover::after{transform:none}

.app{height:100%;display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
/* rail */
.rail{display:flex;flex-direction:column;align-items:center;padding:8px 0 12px;gap:4px}
.logo{width:32px;height:32px;border-radius:8px;background:#fff;color:var(--ink);display:grid;place-items:center;font:600 10px/1 var(--mono);letter-spacing:.02em;margin-bottom:14px;box-shadow:0 0 0 .5px rgba(46,26,16,.16)}
.navb{position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);transition:background .12s,color .12s}
.navb:hover{background:rgba(255,255,255,.35);color:var(--ink)}
.navb[aria-current="page"]{background:rgba(255,255,255,.55);color:var(--ink)}
.navb .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ink2);box-shadow:0 0 0 2px var(--bg)}
.rail .sp{flex:1}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--ink2);color:#F5F4EF;display:grid;place-items:center;font:500 10px/1 var(--sans);margin-top:6px}
/* main */
.main{display:grid;grid-template-rows:48px minmax(0,1fr);min-width:0;min-height:0;padding:0 8px 8px 0}
.top{display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;min-width:0;position:relative;z-index:20}
.back{width:20px;height:28px;display:grid;place-items:center;color:var(--ink2);border-radius:6px;transition:color .12s,background .12s}
.back:hover{color:var(--ink);background:rgba(255,255,255,.35)}
.crumb{display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;border-radius:7px;font:500 12px/1 var(--sans);color:var(--ink2);white-space:nowrap;transition:background .12s,color .12s}
.crumb:hover{background:rgba(255,255,255,.35);color:var(--ink)}
.crumb[aria-expanded="true"]{background:rgba(255,255,255,.75);color:var(--ink);box-shadow:var(--sh-seg)}
.steps{display:flex;align-items:center;margin-left:auto}
.step{position:relative;height:30px;display:flex;align-items:center;font:500 12px/1 var(--sans);white-space:nowrap;border-radius:7px;transition:color .12s,background .18s var(--ease)}
.step.done{color:var(--ink2)}.step.ahead{color:var(--ph)}
.step.done:hover,.step.ahead:hover{color:var(--ink)}
.step.on{padding:0 10px;background:rgba(255,255,255,.75);color:var(--ink);box-shadow:var(--sh-seg)}
.schev{width:4px;height:12px;margin:0 10px;fill:none;stroke:var(--faint);stroke-width:1.25;flex:none}
.schev.done{stroke:var(--ink3)}
.next{display:none;align-items:center;gap:4px;height:30px;padding:0 8px 0 12px;margin-left:12px;border-radius:8px;background:var(--brown);color:#F5F4EF;font:500 12px/1 var(--sans);white-space:nowrap}
.next.ready{display:inline-flex;animation:popIn .2s var(--ease)}
/* panels */
.panels{display:flex;gap:8px;min-height:0;min-width:0}
.card{background:var(--card);border-radius:10px;box-shadow:var(--sh-card);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tree,.side{position:relative;flex:none;transition:width .28s var(--ease-panel),margin .28s var(--ease-panel),opacity .2s var(--ease),transform .28s var(--ease-panel)}
.tree{width:var(--w,320px)}.side{width:var(--w,348px)}
.tree>*,.side>*{min-width:var(--w,320px)}
.side>*{min-width:var(--w,348px)}
.tree.hid{width:0;margin-right:-8px;opacity:0;transform:translateX(-12px);pointer-events:none}
.side.hid{width:0;margin-left:-8px;opacity:0;transform:translateX(12px);pointer-events:none}
.head{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px 0 16px}
.head .grow{flex:1}
.title{font:300 24px/1 "Filed Castillon",var(--serif);font-variation-settings:'wght' 370;letter-spacing:-.01em;margin-top:-1px}
.iconbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink3);transition:background .12s,color .12s}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.walk{opacity:0;transition:opacity .15s}.tree .head:hover .walk{opacity:1}
/* tree */
.tree .body{flex:1;overflow:auto;padding:0 8px 8px}
.row{position:relative;display:flex;align-items:center;height:28px;border-radius:8px;padding-right:8px;cursor:pointer;color:var(--ink);transition:background .12s}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.row .ico{color:var(--ink3);margin-right:8px;display:inline-flex}
.row .ico.pdfc,.row .ico.xlsc{color:var(--ink3)}
.row.sel .ico.pdfc{color:var(--pdf)}.row.sel .ico.xlsc{color:var(--xls)}
.row .meta{font:400 11px/1 var(--sans);color:var(--ink3);margin-left:8px;white-space:nowrap;opacity:0;transition:opacity .12s}
.row:hover .meta{opacity:1}
.row .count{font:400 12px/1 var(--sans);color:var(--ink3)}
.row .obs{width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:8px;flex:none}
.row.enter{animation:rowIn .2s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(-3px)}}
.okc{color:var(--green);display:inline-flex}
.pill{display:inline-grid;place-items:center;min-width:22px;height:16px;padding:0 6px;border-radius:8px;background:var(--amber);color:var(--brown);font:600 10px/1 var(--sans)}
.tdiv{height:1px;background:var(--line);margin:8px -8px}
.sect{display:flex;align-items:center;height:28px;padding:0 8px;font:500 13px/1 var(--sans);color:var(--ink);cursor:default}
.sect.click{cursor:pointer;border-radius:8px}.sect.click:hover{background:var(--hover)}
.sect .rt{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:400 11px/1 var(--sans);color:var(--ink3)}
.prog svg{width:14px;height:14px;transform:rotate(-90deg)}
.prog circle.v{transition:stroke-dasharray .4s var(--ease)}
.cb{width:14px;height:14px;border-radius:3px;border:1px solid #8C857F;background:#fff;display:grid;place-items:center;margin-right:6px;flex:none;transition:background .15s,border-color .15s}
.cb[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.ck{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .22s var(--ease) .04s}
[aria-checked="true"] .ck,[aria-pressed="true"] .box .ck{stroke-dashoffset:0}
.tree .foot{padding:8px 16px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:#fff;font:500 13px/1 var(--sans);transition:background .12s}
.btn:hover{background:var(--hover)}
.btn.block{width:100%}
/* viewer */
.viewer{position:relative;flex:1;min-width:0}
.vbar{position:absolute;top:0;left:0;right:0;height:48px;z-index:5;background:#fff;border-radius:10px;box-shadow:var(--sh-card);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 10px 0 12px;container-type:inline-size}
.vbar .vl,.vbar .vc,.vbar .vr{display:flex;align-items:center;gap:2px;min-width:0}
.vbar .vr{justify-content:flex-end}
.docname{font:500 13px/1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:8px}
.reveal{animation:popIn .2s var(--ease)}
.ctl{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:8px;font:400 12px/1 var(--sans);white-space:nowrap;color:var(--ink);transition:background .12s}
.ctl:hover{background:var(--hover)}
.ctl.on{background:var(--sel);font-weight:500}
.ctl svg.i{color:var(--ink2)}
.ctl .muted{color:var(--ink3)}
.pnav{display:flex;align-items:center;color:var(--ink2)}
.pnav .pg{display:flex;align-items:center;gap:6px;font:400 12px/1 var(--sans);margin:0 2px;white-space:nowrap}
.pnav input{width:26px;height:22px;border:0;border-radius:6px;background:var(--field);text-align:center;font:400 12px/1 var(--sans);color:var(--ink)}
.pnav input:focus{outline:0;box-shadow:0 0 0 1.5px var(--ink2)}
.hvr{width:1px;height:18px;background:var(--line);margin:0 6px}
.signoff{color:var(--ink)}
.signoff[aria-pressed="true"]{color:var(--green)}
.signoff .box{width:14px;height:14px;border-radius:3px;border:1px solid #8C857F;display:grid;place-items:center;transition:background .15s,border-color .15s}
.signoff[aria-pressed="true"] .box{background:var(--green);border-color:var(--green)}
@container (max-width:640px){.ovl-label{display:none}}

<script>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="i ${c}"><use href="#${n}"/></svg>`;

 k1('silver','Silverline Tech Partners LP','91-7745102','1000 2nd Ave','Seattle, WA 98104',[97600,5400,11300,6200,40100,97600,45000]),
 {id:'rental',name:'Rental property income and expenses',type:'XLSX',pages:1,kind:'sheet',comment:true},

];

const clients={recent:[['Johnny Apple','Binder',''],['Alex & Jane Filed','Data entry',''],['Noah Patel','AI review','done']],

const STEPS=['Documents','Binder','Data entry','AI review'];
const allFolders=[];(function w(ns,top){for(const n of ns){if(typeof n==='string')continue;allFolders.push({f:n.f,top,leaf:n.kids.every(k=>typeof k==='string')});w(n.kids,false);}})([...tree,...refs],true);

/* ---------- state ---------- */
const S={doc:'redwood',view:'doc',tool:'select',panel:'annotations',step:1,level:'all',

 t.classList.remove('show');reflow(t);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),undo?4000:1900);};
const fmt=n=>n===0?'0':(n<0?'( '+Math.abs(n).toLocaleString('en-US')+' )':n.toLocaleString('en-US'));
const cv=document.createElement('canvas').getContext('2d');
function midFit(text,px,weight){cv.font=`${weight||400} 13px Geist, system-ui, sans-serif`;if(cv.measureText(text).width<=px)return text;
 const w=text.split(' ');let end=w[w.length-1];if(w.length>2&&(w[w.length-2]+' '+end).length<=14)end=w[w.length-2]+' '+end;
 const sw=text.slice(0,text.length-end.length).trim().split(' ');
 for(let n=sw.length-1;n>=1;n--){const s=sw.slice(0,n).join(' ')+'… '+end;if(cv.measureText(s).width<=px)return s;}
 let st=sw.join(' ');while(st.length>2){st=st.slice(0,-1);const s=st+'… '+end;if(cv.measureText(s).width<=px)return s;}return text;}

/* ---------- top bar ---------- */

function updateBack(){const b=$('#back');const h=S.hist[S.hist.length-1];
 b.dataset.tip=h?`Back to ${h.view==='doc'?shortName(h.doc):h.view==='obs'?'Observations':'Missing information'}`:'Back to Clients';}

/* ---------- tree ---------- */
let seenRows=null;
const LV={all:{ic:'lvl-all',next:'sections',tip:'Show sections only'},sections:{ic:'lvl-sections',next:'folders',tip:'Show folders'},folders:{ic:'lvl-folders',next:'all',tip:'Show everything'}};
function renderLevel(){const b=$('#lvlBtn');b.innerHTML=ic(LV[S.level].ic);b.dataset.tip=LV[S.level].tip;}
function setLevel(l){S.level=l;for(const x of allFolders)S.open[x.f]=l==='all'?true:l==='sections'?false:!x.leaf;renderLevel();renderTree();}
$('#lvlBtn').onclick=()=>{setLevel(LV[S.level].next);toast(S.level==='all'?'Showing everything':S.level==='sections'?'Showing sections only':'Showing folders');};
function ring(done,total){const c=2*Math.PI*5.5;return `<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle class="v" cx="7" cy="7" r="5.5" fill="none" stroke="var(--green)" stroke-width="2" stroke-dasharray="${c*done/total} ${c}"/></svg>`;}
function renderTree(){const b=$('#treeBody');const avail=(b.clientWidth||304)-16;let h='';
 h+=`<div class="row ${S.view==='missing'?'sel':''}" data-view="missing" data-key="v:missing" style="padding-left:8px"><span class="ico">${ic('foldersearch')}</span><span class="lbl">Missing information</span><span class="okc" title="Nothing missing">${ic('check')}</span></div>`;
 h+=`<div class="row ${S.view==='obs'?'sel':''}" data-view="obs" data-key="v:obs" style="padding-left:8px"><span class="ico">${ic('telescope')}</span><span class="lbl">Observations</span><span class="pill" title="1 observation needs attention">1</span></div>`;
 h+=`<div class="tdiv"></div>`;
 const done=srcDocs.filter(x=>S.signed[x]).length;
 h+=`<div class="sect">Source documents<span class="rt prog" id="prog">${ring(done,srcDocs.length)}<span id="progT">${done} of ${srcDocs.length} signed off</span></span></div>`;
 const walk=(nodes,depth)=>{for(const n of nodes){if(typeof n==='string'){docRow(n,depth);continue;}
   const open=S.open[n.f];const pad=8+12*depth;const cnt=countDocs(n);const lblW=avail-pad-24-(open?8:28);
   h+=`<div class="row folder" data-folder="${n.f}" data-key="f:${n.f}" style="padding-left:${pad}px" aria-expanded="${open}" title="${esc(n.name)}"><span class="ico">${ic(open?'foldero':'folder')}</span><span class="lbl">${esc(midFit(n.name,lblW))}</span>${open?'':`<span class="count">${cnt}</span>`}</div>`;
   if(open)walk(n.kids,depth+1);}};
 const docRow=(id,depth)=>{const d=D[id];const pad=8+12*(depth-1);const obs=id==='atlas';const right=(d.comment?24:0)+(obs?14:0);
   const lblW=avail-pad-20-24-right-8;
   h+=`<div class="row doc ${S.view==='doc'&&S.doc===id?'sel':''}" data-doc="${id}" data-key="d:${id}" style="padding-left:${pad}px" title="${esc(d.name)}">
     <button class="cb" role="checkbox" aria-checked="${!!S.signed[id]}" aria-label="Sign off ${esc(d.name)}" data-sign="${id}">${ck()}</button><span class="ico ${d.type==='PDF'?'pdfc':'xlsc'}">${ic(d.type==='PDF'?'pdf':'xls')}</span>
     <span class="lbl" data-full="${esc(d.name)}" data-w="${lblW}">${esc(midFit(d.name,lblW))}</span>
     <span class="meta">${d.pages} ${d.pages>1?'pages':'page'}</span>${d.comment?`<span style="margin-left:8px;color:var(--ink3);display:inline-flex" title="Has a comment">${ic('msg')}</span>`:''}${obs?'<span class="obs" title="1 observation"></span>':''}</div>`;};
 walk(tree,0);
 h+=`<div class="tdiv"></div><div class="sect">References</div>`;walk(refs,0);
 b.innerHTML=h;
 // rows that just appeared (folder opened, level changed) ease in, Linear-style
 const now=new Set();let i=0;
 b.querySelectorAll('[data-key]').forEach(r=>{const k=r.dataset.key;now.add(k);if(seenRows&&!seenRows.has(k)){r.classList.add('enter');r.style.animationDelay=Math.min(i++*14,140)+'ms';}});
 seenRows=now;
 b.querySelectorAll('.row.doc').forEach(r=>{const l=r.querySelector('.lbl');const full=l.dataset.full;const w=+l.dataset.w;
   r.onmouseenter=()=>{l.textContent=midFit(full,w-56);};r.onmouseleave=()=>{l.textContent=midFit(full,w);};});}
function markSel(){$$('#treeBody .row.sel').forEach(r=>r.classList.remove('sel'));
 const r=S.view==='doc'?$(`#treeBody [data-doc="${S.doc}"]`):$(`#treeBody [data-view="${S.view}"]`);if(r){r.classList.add('sel');r.scrollIntoView({block:'nearest'});}}
$('#treeBody').addEventListener('click',e=>{
 const cb=e.target.closest('[data-sign]');if(cb){e.stopPropagation();toggleSign(cb.dataset.sign);return;}
 const f=e.target.closest('[data-folder]');if(f){S.open[f.dataset.folder]=!S.open[f.dataset.folder];renderTree();return;}
 const v=e.target.closest('[data-view]');if(v){go({view:v.dataset.view});return;}
 const d=e.target.closest('[data-doc]');if(d){go({view:'doc',doc:d.dataset.doc});if(matchMedia('(max-width:820px)').matches)$('#tree').classList.add('mclosed');}});

function toggleSign(id,quiet){S.signed[id]=!S.signed[id];
 $$(`[data-sign="${id}"]`).forEach(c=>c.setAttribute('aria-checked',!!S.signed[id]));
 const done=srcDocs.filter(x=>S.signed[x]).length,c=2*Math.PI*5.5;const v=$('#prog circle.v');if(v)v.setAttribute('stroke-dasharray',`${c*done/srcDocs.length} ${c}`);const t=$('#progT');if(t)t.textContent=`${done} of ${srcDocs.length} signed off`;
 if(id===S.doc){const s=$('#soBtn');if(s){s.setAttribute('aria-pressed',!!S.signed[id]);s.querySelector('.sl').textContent=S.signed[id]?'Signed off':'Sign off';}}
 if(!quiet)toast(S.signed[id]?`Signed off ${D[id].name}`:'Sign-off removed',()=>toggleSign(id,true));}

const viewer=$('#viewer'),scroller=$('#scroll');

 if(S.view!=='doc'){h.innerHTML=`<div class="vl">${showT}<span class="docname">${S.view==='obs'?'Observations':'Missing information'}</span></div><div class="vc"></div><div class="vr">${showS}</div>`;return;}
 const d=D[S.doc];

  <div class="vc"><span class="pnav"><button class="iconbtn" id="prevPage" aria-label="Previous page">${ic('cleft')}</button><span class="pg"><input id="pgIn" aria-label="Page number" value="${curPage}"><span>/ <span id="pgN">${pagesFor(d).length}</span></span></span><button class="iconbtn" id="nextPage" aria-label="Next page">${ic('cright')}</button></span>
  <span class="hvr"></span><button class="ctl zoom" id="zBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Zoom">${Math.round(S.zoom*100)}%${ic('cdown','sm')}</button>
  <button class="ctl ${S.overlay?'on':''}" id="ovBtn" aria-haspopup="dialog" aria-expanded="false">${ic('layers')}${ov}${ic('cdown','sm')}</button></div>
  <div class="vr"><button class="ctl signoff" id="soBtn" aria-pressed="${!!S.signed[S.doc]}"><span class="box">${ck()}</span><span class="sl">${S.signed[S.doc]?'Signed off':'Sign off'}</span></button>
  <button class="iconbtn" id="vMore" aria-label="More" aria-expanded="false" data-tip="More" data-tip-pos="below-r">${ic('dots')}</button>${showS}</div>`;}
$('#vbar').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.id==='soBtn')toggleSign(S.doc);
 if(t.id==='prevPage')goPage(Math.max(1,curPage-1));
 if(t.id==='nextPage')goPage(Math.min(+$('#pgN').textContent,curPage+1));
 if(t.id==='zBtn')openZoom(t);
 if(t.id==='ovBtn')openOverlay(t);
 if(t.id==='vMore')openMore(t);
 if(t.id==='showTree')setHidden('tree',false);
 if(t.id==='showSide')setHidden('side',false);});

const MK={tick:'check',cross:'x',flag:'flag'};
function cell(id,val,raw){const k=S.marks[S.doc]?.[id]||[];const del=S.showDel&&(S.deleted[S.doc]?.[id]||[]).length;
 const mk=k.filter(x=>x!=='hl').map(x=>`<span class="mk" title="Alex Griffin">${ic(MK[x])}AG</span>`).join('');
 const ov=S.overlay&&S.overlay.type==='Data entry'&&raw!==undefined&&id.startsWith('p2')?`<span class="ovchip">✓ entered</span>`:'';
 return `<td class="v ${k.includes('hl')?'hl':''} ${del?'del':''}" data-cell="${id}" data-raw="${raw??''}">${mk}${ov}${esc(val)}</td>`;}
function pagesFor(d){
 if(d.kind==='k1'){const a=d.amts;const rows=[['1','Ordinary business income (loss)',a[0]],['5','Interest income',a[1]],['6a','Ordinary dividends',a[2]],['8','Net short-term capital gain',a[3]],['9a','Net long-term capital gain',a[4]],['13W','Section 199A income',a[5]],['19A','Cash distributions',a[6]],['20Z','Section 199A information',null]];
  const isC=b=>S.cite&&S.cite.doc===d.id&&S.cite.row===b;
  return [`<h2>Schedule K-1 (Form 1065) · Tax Year 2024</h2><table><tr><th>Field</th><th>Value</th></tr>
   <tr><td>Partnership Name</td>${cell('p1-name',d.name)}</tr><tr><td>EIN</td>${cell('p1-ein',d.ein)}</tr><tr><td>Address</td>${cell('p1-addr',d.addr)}</tr><tr><td>City / State / ZIP</td>${cell('p1-city',d.city)}</tr><tr><td>Tax Year</td>${cell('p1-year','2024')}</tr></table>`,
   `<table><tr><th>Box</th><th>Description</th><th>Amount</th></tr>${rows.map(([b,t,v])=>`<tr data-row="${b}" class="${isC(b)?'cite '+(S.cite.amber?'amber':''):''}"><td class="n" style="position:relative">${isC(b)?'<span class="citeb">1</span>':''}${b}</td><td>${t}</td>${v===null?cell('p2-'+b,'See Statement A'):cell('p2-'+b,fmt(v),v)}</tr>`).join('')}</table>`,
   `<h2 style="font-size:1.2em;text-align:left">Statement A · Section 199A information</h2><table><tr><th>Item</th><th>Amount</th></tr><tr><td>QBI income</td>${cell('p3-qbi',fmt(a[5]),a[5])}</tr><tr><td>W-2 wages</td>${cell('p3-w2',fmt(Math.round(a[5]*.31)),Math.round(a[5]*.31))}</tr><tr><td>UBIA of qualified property</td>${cell('p3-ubia',fmt(Math.round(a[5]*1.9)),Math.round(a[5]*1.9))}</tr></table><p class="note">Sample document for the prototype. Not for filing.</p>`];}
 if(d.kind==='sheet'){const r=[['Rents received',38400],['Repairs',-2650],['Insurance',-1480],['Mortgage interest',-9120],['Taxes',-4310],['Depreciation',-7900]];const tot=r.reduce((s,x)=>s+x[1],0);
  return [`<h2 style="font-size:1.2em;text-align:left">Rental property · 14 Elm Ct</h2><table><tr><th>Line</th><th>Amount</th></tr>${r.map(([t,v],i)=>`<tr><td>${t}</td>${cell('p1-r'+i,fmt(v),v)}</tr>`).join('')}<tr><td><b>Net</b></td>${cell('p1-net',fmt(tot),tot)}</tr></table><p class="note">Comment: “Repairs include roof patch in March.”</p>`];}
 if(d.kind==='sheet2'){const r=[['Gross receipts',182500],['Contract labor',-24800],['Software',-6120],['Travel',-3940],['Home office',-2400]];const tot=r.reduce((s,x)=>s+x[1],0);
  return [`<h2 style="font-size:1.2em;text-align:left">Summit Advisory Group LLC · 2024</h2><table><tr><th>Line</th><th>Amount</th></tr>${r.map(([t,v],i)=>`<tr><td>${t}</td>${cell('p1-s'+i,fmt(v),v)}</tr>`).join('')}<tr><td><b>Net profit</b></td>${cell('p1-np',fmt(tot),tot)}</tr></table>`];}
 if(d.kind==='1098')return [`<h2>Form 1098 · Mortgage Interest Statement 2024</h2><table><tr><th>Box</th><th>Amount</th></tr><tr><td>1 Mortgage interest received</td>${cell('p1-1','18,642',18642)}</tr><tr><td>2 Outstanding principal</td>${cell('p1-2','612,400',612400)}</tr><tr><td>10 Property tax</td>${cell('p1-10','7,215',7215)}</tr></table>`];
 if(d.kind==='scha')return [`<h2 style="font-size:1.2em;text-align:left">Schedule A worksheet</h2><table><tr><th>Item</th><th>Amount</th></tr><tr><td>State and local taxes (capped)</td>${cell('p1-salt','10,000',10000)}</tr><tr><td>Mortgage interest</td>${cell('p1-mi','18,642',18642)}</tr><tr><td>Charitable gifts</td>${cell('p1-ch','4,500',4500)}</tr></table>`];
 if(d.kind==='ret')return [`<h2>Form 1040 · 2024 (draft)</h2><p class="note">Preparer copy · draft</p>`,`<h2 style="font-size:1.2em;text-align:left">Schedule 1</h2>`,`<h2 style="font-size:1.2em;text-align:left">Schedule B</h2>`,
  `<h2 style="font-size:1.2em;text-align:left">Schedule E · Part II</h2><table><tr><th>Partnership</th><th>Nonpassive income</th></tr>${docs.filter(x=>x.kind==='k1').map(x=>`<tr><td>${x.name}</td>${cell('p4-'+x.id,fmt(x.amts[0]),x.amts[0])}</tr>`).join('')}</table>`];
 return ['']; }
function renderPages(anim){const p=$('#pages');
 if(S.view==='missing'){p.innerHTML=`<div class="empty"><div class="ecard"><h3>No missing information</h3><p>Every checklist item for this binder has a document.</p></div></div>`;}
 else if(S.view==='obs'){p.innerHTML=`<div class="empty"><div class="ecard"><h3>1 observation</h3><p>Findings Filed AI flags on your documents show up here.</p>
   <div class="obsitem" data-goto="atlas"><span style="color:var(--amberI);display:inline-flex">${ic('telescope')}</span><div><b style="font-weight:500">Atlas Infrastructure Partners LP</b><div style="color:var(--ink2)">Box 19A distributions of 25,000 exceed the capital account withdrawals. Check page 2.</div></div></div></div></div>`;}
 else{const d=D[S.doc];const pg=pagesFor(d);
  p.innerHTML=pg.map((c,i)=>`<div class="page" data-page="${i+1}" style="${S.rot?`transform:rotate(${S.rot}deg)`:''}"><div class="pin">${c}</div><div class="pnum">Page ${i+1} of ${pg.length}</div></div>`).join('');}
 $('#app').classList.toggle('hide-ann',S.hideAnn);
 if(anim)replay(p,'swap');}
$('#pages').addEventListener('click',e=>{const g=e.target.closest('[data-goto]');if(g){go({view:'doc',doc:g.dataset.goto,page:2});return;}
 const c=e.target.closest('td.v');if(!c)return;const id=c.dataset.cell;
 if(S.panel==='calc'&&!S.sideHidden&&c.dataset.raw!==''){S.tape.push({op:'+',v:+c.dataset.raw,src:`${D[S.doc].name.split(' ')[0]} · ${id.replace('-',' · ')}`});renderSide();toast('Added to tape');return;}
 const map={highlighter:'hl',htext:'hl',tick:'tick',cross:'cross',flag:'flag'};const m=map[S.tool];
 if(S.tool==='eraser'){if(S.marks[S.doc]?.[id]){(S.deleted[S.doc]??={})[id]=S.marks[S.doc][id];const doc=S.doc,prev=S.marks[doc][id];delete S.marks[doc][id];renderPages();toast('Annotation removed',()=>{S.marks[doc][id]=prev;delete S.deleted[doc][id];renderPages();});}return;}
 if(!m)return;const arr=((S.marks[S.doc]??={})[id]??=[]);const i=arr.indexOf(m);i>=0?arr.splice(i,1):arr.push(m);renderPages();});
scroller.addEventListener('scroll',()=>{viewer.classList.toggle('scrolled',scroller.scrollTop>2);const pages=$$('.page');let cur=1;const top=scroller.scrollTop+scroller.clientHeight*0.35;pages.forEach(p=>{if(p.offsetTop<=top)cur=+p.dataset.page;});curPage=cur;const i=$('#pgIn');if(i&&document.activeElement!==i)i.value=cur;},{passive:true});
const goPage=n=>{const p=$(`.page[data-page="${n}"]`);if(p)scroller.scrollTo({top:p.offsetTop-56,behavior:'smooth'});};
$('#vbar').addEventListener('change',e=>{if(e.target.id==='pgIn')goPage(+e.target.value||1);});
const step=dir=>{const i=order.indexOf(S.doc);go({view:'doc',doc:order[(i+dir+order.length)%order.length]});};
const fitZ=()=>Math.min($('#vbar').clientWidth-24,780)/520;
const setZoom=(z,fit=false)=>{S.fit=fit;S.zoom=Math.min(2,Math.max(.5,Math.round(z*1000)/1000));viewer.style.setProperty('--z',S.zoom);const b=$('#zBtn');if(b)b.innerHTML=`${Math.round(S.zoom*100)}%${ic('cdown','sm')}`;};
new ResizeObserver(()=>{if(S.fit)setZoom(fitZ(),true);}).observe(viewer);
function openZoom(a){const zs=[0.75,1,1.25,1.5,2];const el=pop(a,`<button class="item" data-z="in">${ic('plus')}Zoom in<span class="r"><span class="kbd">⌘</span><span class="kbd">+</span></span></button><button class="item" data-z="out">${ic('minus')}Zoom out<span class="r"><span class="kbd">⌘</span><span class="kbd">−</span></span></button><div class="hr"></div>${zs.map(z=>`<button class="item ${!S.fit&&S.zoom===z?'act':''}" data-z="${z}">${!S.fit&&S.zoom===z?ic('check'):'<span style="width:16px"></span>'}${z*100}%</button>`).join('')}<button class="item ${S.fit?'act':''}" data-z="fit">${S.fit?ic('check'):'<span style="width:16px"></span>'}Fit to width</button><div class="hr"></div><button class="item" data-z="rot">${ic('rotate')}Rotate page</button>`,'center');
 el.onclick=e=>{const b=e.target.closest('[data-z]');if(!b)return;const v=b.dataset.z;closePop();if(v==='in')setZoom(S.zoom+.1);else if(v==='out')setZoom(S.zoom-.1);else if(v==='fit')setZoom(fitZ(),true);else if(v==='rot'){S.rot=(S.rot+90)%360;renderPages();}else setZoom(+v);};}

/* one place for navigation, so Back always knows where you came from */
function go(to,o={}){const cur={view:S.view,doc:S.doc};
 const same=to.view===S.view&&(to.view!=='doc'||to.doc===S.doc);
 if(!same&&!o.back){S.hist.push(cur);if(S.hist.length>30)S.hist.shift();}
 S.view=to.view;if(to.doc)S.doc=to.doc;S.rot=0;curPage=1;
 if(!same){markSel();renderVHead();renderPages(true);scroller.scrollTo({top:0,behavior:'instant'});viewer.classList.remove('scrolled');}
 updateBack();
 if(to.page)setTimeout(()=>goPage(to.page),60);}

/* ---------- popovers ---------- */
let popEl=null;
function closePop(){if(popEl){const el=popEl;popEl=null;el.classList.add('out');setTimeout(()=>el.remove(),110);}$$('[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));}
function pop(anchor,html,align){closePop();const r=anchor.getBoundingClientRect();const el=document.createElement('div');el.className='pop'+(align==='right'?' r':'');el.innerHTML=html;document.body.appendChild(el);
 const w=el.offsetWidth;let x=align==='right'?r.right-w:align==='center'?r.left+r.width/2-w/2:r.left;x=Math.max(8,Math.min(x,innerWidth-w-8));el.style.left=x+'px';el.style.top=(r.bottom+6)+'px';
 if(align==='center')el.style.transformOrigin='top center';popEl=el;anchor.setAttribute('aria-expanded','true');
 setTimeout(()=>{const i=el.querySelector('input');if(i)i.focus();});return el;}
document.addEventListener('mousedown',e=>{if(popEl&&!popEl.contains(e.target)&&!e.target.closest('[aria-expanded="true"]'))closePop();});
function openOverlay(a){if(a.getAttribute('aria-expanded')==='true'){closePop();return;}
 const runs=[{type:'Data entry',date:'Nov 5, 13:25',status:'Draft',dot:'n'},{type:'AI review',date:'Nov 5, 06:40',status:'Completed',dot:''}];
 const el=pop(a,`<div style="width:300px"><div class="search">${ic('search')}<input placeholder="Find a run" aria-label="Find a run"></div>
  <button class="item ${!S.overlay?'act':''}" data-ov="none">${!S.overlay?ic('check'):'<span style="width:16px"></span>'}<span>No overlay</span></button>
  ${runs.map((r,i)=>{const on=S.overlay&&S.overlay.type===r.type;return `<button class="item ${on?'act':''}" data-ov="${i}">${on?ic('check'):'<span style="width:16px"></span>'}<span style="display:flex;flex-direction:column;gap:4px"><span>${r.date}</span><span style="display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12px"><span class="sdot ${r.dot}"></span>${r.status}</span></span><span class="r"><span class="tag">${r.type}</span></span></button>`;}).join('')}
  <div class="hr"></div><button class="item" data-ov="new">${ic('plus')}New run</button></div>`,'center');
 el.onclick=e=>{const b=e.target.closest('[data-ov]');if(!b)return;const v=b.dataset.ov;if(v==='new'){toast('Starts a new run');closePop();return;}
  S.overlay=v==='none'?null:{type:runs[+v].type,date:runs[+v].date.split(',')[0]};closePop();renderVHead();renderPages();if(S.overlay)toast(`Showing ${S.overlay.type} over the document`);};}
function openMore(a){if(a.getAttribute('aria-expanded')==='true'){closePop();return;}
 const el=pop(a,`<button class="item" data-m="win">${ic('external')}Open in new window</button><button class="item" data-m="dl">${ic('download')}Download</button><div class="hr"></div>
  <button class="item" data-m="hide">${ic('eyeoff')}${S.hideAnn?'Show annotations':'Hide annotations'}<span class="r"><span class="kbd">⇧</span><span class="kbd">H</span></span></button>
  <button class="item" data-m="keys">${ic('kbdi')}Keyboard shortcuts<span class="r"><span class="kbd">?</span></span></button>
  <button class="item" data-m="re">${ic('refresh')}Reprocess binder</button>`,'right');
 el.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;closePop();
  if(m==='win')toast('Opens the document in a new window');if(m==='dl')toast(`Downloading ${D[S.doc].name}.pdf`);if(m==='hide')toggleHide();if(m==='keys')showKeys();if(m==='re')toast('Reprocessing the binder');};}

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(document.activeElement?.tagName);const mod=e.metaKey||e.ctrlKey;const k=e.key.toLowerCase();
 if(mod&&k==='k'){e.preventDefault();cmdEl?closeCmd():openCmd();return;}
 if(mod&&k==='i'){e.preventDefault();openChatTab();return;}
 if(mod&&k==='j'){e.preventDefault();openClients($('#crClient'));return;}
 if(mod&&e.key==='Enter'){e.preventDefault();toggleSign(S.doc);return;}
 if(e.key==='Escape'){closePop();closeCmd();return;}
 if(typing||cmdEl||keysEl||mod||e.altKey)return;
 if(e.key==='['){setHidden('tree',!S.treeHidden);return;}
 if(e.key===']'){setHidden('side',!S.sideHidden);return;}
 if(k==='j'&&!e.shiftKey)step(1);else if(k==='k')step(-1);else if(e.key==='H'&&e.shiftKey)toggleHide();
 else if(e.key==='?')showKeys();else if(!e.shiftKey){const m={v:'select',e:'eraser',g:'highlighter',h:'htext','3':'tick','4':'cross',f:'flag'}[k];if(m)pickTool(m);}});

/* ---------- boot ---------- */
renderSteps();renderLevel();renderTree();renderVHead();renderPages();renderSide();updateBack();setZoom(fitZ(),true);
const ready=()=>{renderTree();moveThumb();requestAnimationFrame(()=>$('#seg').classList.add('ready'));};
(document.fonts?document.fonts.ready:Promise.resolve()).then(ready);
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{renderTree();moveThumb();},120);});
})();
</script>

</html>
